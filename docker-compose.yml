version: "3.9"

# ── Shared environment for backend + celery ────────────────────────────────
x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://wg_user:wg_pass@db:5432/website_generator
  REDIS_URL: redis://redis:6379/0
  FRONTEND_URL: http://localhost:3000
  ALLOWED_ORIGIN: http://localhost:3000,http://localhost:3001

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: wg_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: website_generator
      POSTGRES_USER: wg_user
      POSTGRES_PASSWORD: wg_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wg_user -d website_generator"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: wg_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wg_backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_PROFILE: development
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./frontend/public:/app/frontend_public:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # ── Celery Worker ─────────────────────────────────────────────────────────
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wg_celery
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_PROFILE: development
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2 -Q default,email,scoring

  # ── Celery Beat (scheduled tasks) ─────────────────────────────────────────
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wg_celery_beat
    restart: unless-stopped
    environment:
      <<: *backend-env
      APP_PROFILE: development
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    depends_on:
      - celery
    command: celery -A workers.celery_app beat --loglevel=info

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wg_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
