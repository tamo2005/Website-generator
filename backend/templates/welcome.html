<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body style="margin:0;padding:0;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#0f172a;padding:40px 0;">
    <tr><td align="center">
      <table width="560" cellpadding="0" cellspacing="0" style="background:#1e293b;border-radius:16px;border:1px solid rgba(255,255,255,0.06);overflow:hidden;">
        <!-- Header -->
        <tr><td style="background:linear-gradient(135deg,#10b981 0%,#06b6d4 100%);padding:32px 40px;">
          <h1 style="margin:0;font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.02em;">{{ app_name }}</h1>
        </td></tr>
        <!-- Body -->
        <tr><td style="padding:40px;">
          <h2 style="margin:0 0 16px;font-size:20px;font-weight:700;color:#f1f5f9;">Welcome aboard! 🎉</h2>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#94a3b8;">
            Hey <strong style="color:#e2e8f0;">{{ username }}</strong>, your email has been verified and your account is ready to go!
          </p>
          <p style="margin:0 0 24px;font-size:15px;line-height:1.7;color:#94a3b8;">
            You can now generate stunning websites with AI, export them as production-ready code, and build your portfolio.
          </p>
          <table cellpadding="0" cellspacing="0"><tr><td>
            <a href="{{ app_url }}"
               style="display:inline-block;padding:14px 32px;background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;font-size:14px;font-weight:700;text-decoration:none;border-radius:10px;letter-spacing:0.02em;">
              Start Building
            </a>
          </td></tr></table>
          <hr style="margin:28px 0;border:none;border-top:1px solid rgba(255,255,255,0.06);" />
          <p style="margin:0;font-size:12px;color:#475569;">
            Happy building!<br/>
            <strong style="color:#64748b;">The {{ app_name }} Team</strong>
          </p>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
